# Apple Developer ID identity used for release builds, notarization and DMG signing.
# The Team ID is not a secret — it appears in every signature the app ships with.
# Fill both in, then `bash build_app.sh` signs with Developer ID + hardened runtime.
#
# Find the exact identity string with:
#   security find-identity -p codesigning -v | grep "Developer ID Application"
#
# Environment variables of the same name override anything set here.

DEVELOPER_ID_APP="Developer ID Application: Ihor Yaremenko (KRLH2MYRS7)"  # e.g. "Developer ID Application: Ihor Yaremenko (AB12CD34EF)"
TEAM_ID="KRLH2MYRS7"     # e.g. "AB12CD34EF" — the 10-character ID in the parentheses above

# Keychain profile for `xcrun notarytool`, created once with:
#   xcrun notarytool store-credentials switcher3way-notary \
#       --apple-id <your Apple ID> --team-id <TEAM_ID> --password <app-specific password>
NOTARIZE_PROFILE="switcher3way-notary"

# --- Mac App Store flavour (bash build_app.sh --appstore) -------------------------------------
# Different certificates entirely from the Developer ID above: the store rejects a Developer ID
# signature, and the .pkg needs an installer certificate the app certificate cannot produce.
APPLE_DISTRIBUTION="Apple Distribution: Ihor Yaremenko (KRLH2MYRS7)"
INSTALLER_DISTRIBUTION="3rd Party Mac Developer Installer: Ihor Yaremenko (KRLH2MYRS7)"

# Mac App Store provisioning profile for site.ironmade.switcher3way, downloaded from the developer
# portal. Embedded into the bundle as Contents/embedded.provisionprofile. Without it StoreKit has
# no App Store context, so no product ever loads and no purchase can be tested.
PROVISION_PROFILE="signing/Switcher3Way_Mac_App_Store.provisionprofile"
